name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint & Format ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Keep LuaRocks independent of Ubuntu's outdated package and LuaSec downloader.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.13.0"

      - name: Install luacheck
        run: |
          luarocks --version
          luarocks install luacheck 1.2.0-1
          luacheck --version

      - name: Run luacheck
        run: luacheck lua/ plugin/ tests/

      - name: Check formatting (StyLua)
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ plugin/ tests/

  # ─── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Neovim ${{ matrix.neovim }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        neovim:
          - v0.10.0
          - nightly

    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim (${{ matrix.neovim }})
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Clone plenary.nvim
        run: git clone --depth=1 https://github.com/nvim-lua/plenary.nvim .tests/plenary.nvim

      - name: Run tests
        run: make test

      - name: Check generated docs are up to date
        run: make check-doc
